<svg class="plan-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="plan-title plan-desc">
<title id="plan-title">Plan view of a typical Beaverton house lot with five numbered trees</title>
<desc id="plan-desc">A street with a planting strip and sidewalk, a house with an attached garage and driveway, an arborvitae hedge on the side line, and five tagged items: a street tree, a Douglas-fir over the garage, a maple with a broken limb over the driveway, an old stump in the front lawn, and a stump where a new shed is planned.</desc>
